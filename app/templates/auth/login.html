{% extends "base.html" %}
{% block title %}Login{% endblock %}

{% block fullpage %}
<div class="login-wrapper">
    <div class="login-card">
        <div class="logo-section">
            <div class="logo-icon-lg">🛡</div>
            <h1>Secure Login</h1>
            <p class="login-subtitle">Question Paper Assembly System</p>
        </div>

        <form method="POST" action="{{ url_for('auth.login') }}" id="login-form">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

            <div class="form-group">
                <label class="form-label" for="username">Username</label>
                <input type="text" id="username" name="username" class="form-control"
                       placeholder="Enter your username" required autocomplete="username" autofocus>
            </div>

            <div class="form-group">
                <label class="form-label" for="password">Password</label>
                <input type="password" id="password" name="password" class="form-control"
                       placeholder="Enter your password" required autocomplete="current-password">
            </div>

            <button type="submit" class="btn btn-primary" id="login-btn">
                🔐 Sign In
            </button>
        </form>

        <div style="margin-top: 24px; text-align: center;">
            <span class="security-indicator secure">
                <span class="pulse"></span>
                AES-256-GCM Encrypted
            </span>
        </div>
    </div>
</div>
{% endblock %}
